<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>New Airline Employee</title></head>
<body>
<h2>New Airline Employee</h2>
<form th:action="@{/airlineemployees}" th:object="${employee}" method="post">
    <label>ID: <input type="text" th:field="*{id}"/></label><br/>
    <label>Name: <input type="text" th:field="*{name}"/></label><br/>
    <label>Role: <input type="text" th:field="*{role}"/></label><br/>
    <button type="submit">Create</button>
</form>
</body>
</html>
