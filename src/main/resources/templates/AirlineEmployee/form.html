<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Airline Employee</title>
</head>
<body>
<h1>Add New Airline Employee</h1>

<form th:action="@{/airlineemployees}" th:object="${airlineemployee}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br><br>

    <label>Role:</label>
    <input type="text" th:field="*{role}" required><br><br>

    <button type="submit">Add</button>
</form>

<a href="/airlineemployees">Back to list</a>

</body>
</html>
