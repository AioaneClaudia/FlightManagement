<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airline Employee Form</title>
</head>
<body>
<h2 th:text="${employee.id != '' ? 'Edit Airline Employee' : 'New Airline Employee'}"></h2>

<form th:action="@{${employee.id} != '' ? '/airlineemployees/' + ${employee.id} : '/airlineemployees'}"
      th:object="${employee}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${employee.id} != ''"/><br/><br/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/><br/>

    <label>Role:</label>
    <input type="text" th:field="*{role}" required/><br/><br/>

    <button type="submit" th:text="${employee.id != '' ? 'Update' : 'Create'}"></button>
</form>

<a href="/airlineemployees">Back to list</a>
</body>
</html>
