<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Luggages</title></head>
<body>
<h2>Luggages</h2>
<a href="/luggages/new">Add new</a>
<table border="1">
    <thead><tr><th>ID</th><th>TicketId</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="l : ${luggages}">
        <td th:text="${l.id}">id</td>
        <td th:text="${l.ticketId}">tid</td>
        <td th:text="${l.status}">status</td>
        <td>
            <form th:action="@{'/luggages/' + ${l.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
