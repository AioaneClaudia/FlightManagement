<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Luggage Details</title>
</head>
<body>
<h2>Luggage Details</h2>

<div>
    <p><strong>ID:</strong> <span th:text="${luggage.id}"></span></p>
    <p><strong>Type:</strong> <span th:text="${luggage.type}"></span></p>
    <p><strong>Weight:</strong> <span th:text="${luggage.weight}"></span></p>
    <p><strong>Ticket:</strong>
        <span th:text="${luggage.ticket != null} ? ${luggage.ticket.passengerName} + ' (' + ${luggage.ticket.id} + ')' : 'N/A'"></span>
    </p>
    <p><strong>Status:</strong> <span th:text="${luggage.status}"></span></p>
</div>

<br/>
<a th:href="@{'/luggages/' + ${luggage.id} + '/edit'}">Edit</a> |
<form th:action="@{'/luggages/' + ${luggage.id} + '/delete'}" method="post" style="display:inline">
    <button type="submit">Delete</button>
</form> |
<a href="/luggages">Back to list</a>
</body>
</html>
