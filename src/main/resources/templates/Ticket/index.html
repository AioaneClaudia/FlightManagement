<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Tickets</title></head>
<body>
<h2>Tickets</h2>
<a href="/tickets/new">Add new</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>PassengerId</th>
        <th>FlightId</th>
        <th>Price</th>
        <th>Seat</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="t : ${tickets}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.passengerId}"></td>
        <td th:text="${t.flightId}"></td>
        <td th:text="${t.price}"></td>
        <td th:text="${t.seatNumber}"></td>

        <td>
            <a th:href="@{'/tickets/' + ${t.id} + '/details'}">Details</a>
            <a th:href="@{'/tickets/' + ${t.id} + '/edit'}">Edit</a>

            <form th:action="@{'/tickets/' + ${t.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
