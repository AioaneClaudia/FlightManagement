<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tickets</title>
</head>
<body>
<h2>Tickets</h2>

<a th:href="@{/tickets/new}">Add new</a>
<br/><br/>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Passenger</th>
        <th>Flight</th>
        <th>Price</th>
        <th>Seat</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tickets}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.passengerId}"></td>
        <td th:text="${t.flight != null} ? ${t.flight.name} + ' (' + ${t.flight.id} + ')' : 'N/A'"></td>
        <td th:text="${t.price}"></td>
        <td th:text="${t.seatNumber}"></td>
        <td>
            <a th:href="@{'/tickets/' + ${t.id} + '/details'}">Details</a> |
            <a th:href="@{'/tickets/' + ${t.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/tickets/' + ${t.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Are you sure?')">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(tickets)}">
        <td colspan="6">No tickets found.</td>
    </tr>
    </tbody>
</table>

<a href="/flights">Back to Flights</a>
</body>
</html>
