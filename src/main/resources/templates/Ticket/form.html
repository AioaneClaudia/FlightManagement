<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${ticket.id} != null ? 'Edit Ticket' : 'New Ticket'">Ticket Form</title>
</head>
<body>

<h2 th:text="${ticket.id} != null ? 'Edit Ticket' : 'New Ticket'"></h2>

<form th:action="${ticket.id} != null ? @{ '/tickets/' + ${ticket.id} } : @{ '/tickets' }"
      th:object="${ticket}" method="post">

    <!-- Passenger ID -->
    <label>Passenger ID:</label>
    <input type="text" th:field="*{passengerId}" />
    <div th:if="${#fields.hasErrors('passengerId')}" th:errors="*{passengerId}"></div>
    <br/>

    <!-- Passenger Name -->
    <label>Passenger Name:</label>
    <input type="text" th:field="*{passengerName}" />
    <div th:if="${#fields.hasErrors('passengerName')}" th:errors="*{passengerName}"></div>
    <br/>

    <!-- Flight ID -->
    <label>Flight ID:</label>
    <input type="text" th:field="*{flightId}" />
    <div th:if="${#fields.hasErrors('flightId')}" th:errors="*{flightId}"></div>
    <br/>

    <!-- Price -->
    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" />
    <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    <br/>

    <!-- Seat Number -->
    <label>Seat Number:</label>
    <input type="text" th:field="*{seatNumber}" />
    <div th:if="${#fields.hasErrors('seatNumber')}" th:errors="*{seatNumber}"></div>
    <br/>

    <button type="submit">Save</button>
</form>

<a href="/tickets">Back to list</a>

</body>
</html>
