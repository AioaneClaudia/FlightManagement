<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Ticket Details</title></head>
<body>

<h2>Ticket Details</h2>

<p><strong>ID:</strong> <span th:text="${ticket.id}"></span></p>
<p><strong>Passenger ID:</strong> <span th:text="${ticket.passengerId}"></span></p>
<p><strong>Flight ID:</strong> <span th:text="${ticket.flightId}"></span></p>
<p><strong>Price:</strong> <span th:text="${ticket.price}"></span></p>
<p><strong>Seat Number:</strong> <span th:text="${ticket.seatNumber}"></span></p>

<a href="/tickets">Back</a>
<a th:href="@{'/tickets/' + ${ticket.id} + '/edit'}">Edit</a>

<form th:action="@{'/tickets/' + ${ticket.id} + '/delete'}" method="post" style="display:inline">
    <button type="submit">Delete</button>
</form>

</body>
</html>
