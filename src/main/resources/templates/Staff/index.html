<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Staff</title></head>
<body>
<h2>Staff</h2>
<a href="/staffs/new">Add new</a>
<table border="1">
    <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="s : ${staffs}">
        <td th:text="${s.id}">id</td>
        <td th:text="${s.name}">name</td>
        <td th:text="${s.getClass().getSimpleName()}">type</td>
        <td>
            <form th:action="@{'/staffs/' + ${s.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
