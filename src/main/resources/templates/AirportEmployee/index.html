<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Airport Employees</title></head>
<body>
<h2>Airport Employees</h2>
<a href="/airportemployees/new">Add new</a>
<table border="1">
    <thead><tr><th>ID</th><th>Name</th><th>Designation</th><th>Department</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.id}">id</td>
        <td th:text="${e.name}">name</td>
        <td th:text="${e.designation}">desig</td>
        <td th:text="${e.department}">dept</td>
        <td>
            <a th:href="@{'/airportemployees/' + ${e.id} + '/details'}">Details</a>
            <a th:href="@{'/airportemployees/' + ${e.id} + '/edit'}">Edit</a>
            <form th:action="@{'/airportemployees/' + ${e.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
