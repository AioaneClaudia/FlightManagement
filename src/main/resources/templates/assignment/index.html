<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Flight Assignments</title>
</head>
<body>
<h2>Flight Assignments</h2>

<!-- Flash message -->
<div th:if="${message}" th:text="${message}" style="color:green; margin-bottom:10px;"></div>

<!-- Link pentru creare nou assignment -->
<a href="/assignments/new">New Assignment</a>
<br/><br/>

<!-- Form filtrare -->
<form th:action="@{/assignments}" method="get">
    <label>ID:</label>
    <input type="text" name="id" th:value="${idFilter}" placeholder="Filter by ID"/>
    <label>Staff ID:</label>
    <input type="text" name="staffId" th:value="${staffIdFilter}" placeholder="Filter by Staff ID"/>
    <label>Flight ID:</label>
    <input type="text" name="flight" th:value="${flightFilter}" placeholder="Filter by Flight ID"/>
    <button type="submit">Filter</button>
    <a href="/assignments">Reset</a>
</form>
<br/>

<!-- Tabel assignment-uri -->
<table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
        <th>
            <a th:href="@{/assignments(sortField='id', sortDir=${sortField=='id'?reverseSortDir: 'asc'})}">
                ID <span th:text="${sortField=='id'?sortDir:''}"></span>
            </a>
        </th>
        <th>
            <a th:href="@{/assignments(sortField='flight', sortDir=${sortField=='flight'?reverseSortDir: 'asc'})}">
                Flight <span th:text="${sortField=='flight'?sortDir:''}"></span>
            </a>
        </th>
        <th>
            <a th:href="@{/assignments(sortField='staffId', sortDir=${sortField=='staffId'?reverseSortDir: 'asc'})}">
                Staff ID <span th:text="${sortField=='staffId'?sortDir:''}"></span>
            </a>
        </th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}">ID</td>
        <td th:text="${assignment.flight != null} ? ${assignment.flight.name} + ' (' + ${assignment.flight.id} + ')' : 'N/A'">Flight</td>
        <td th:text="${assignment.staffId}">Staff ID</td>
        <td>
            <a th:href="@{'/assignments/' + ${assignment.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/assignments/' + ${assignment.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form> |
            <a th:href="@{'/assignments/' + ${assignment.id} + '/details'}">Details</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(assignments)}">
        <td colspan="4">No assignments found.</td>
    </tr>
    </tbody>
</table>

<a href="/flights">Back to Flights</a>

</body>
</html>
