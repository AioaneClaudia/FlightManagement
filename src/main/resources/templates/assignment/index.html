<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Flight Assignments</title>
</head>
<body>
<h2>Flight Assignments</h2>

<a href="/assignments/new">New Assignment</a>
<br/><br/>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Flight</th>
        <th>Staff ID</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}">ID</td>
        <td th:text="${assignment.flight != null} ? ${assignment.flight.name} + ' (' + ${assignment.flight.id} + ')' : 'N/A'">Flight</td>
        <td th:text="${assignment.staffId}">Staff ID</td>
        <td>
            <a th:href="@{'/assignments/' + ${assignment.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/assignments/' + ${assignment.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form> |
            <a th:href="@{'/assignments/' + ${assignment.id} + '/details'}">Details</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(assignments)}">
        <td colspan="4">No assignments found.</td>
    </tr>
    </tbody>
</table>

<a href="/flights">Back to Flights</a>

</body>
</html>
