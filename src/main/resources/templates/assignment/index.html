<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Flight Assignments</title></head>
<body>
<h2>Flight Assignments</h2>

<a href="/assignments/new">Add New Assignment</a>
<br/><br/>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Flight ID</th>
        <th>Staff ID</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}"></td>
        <td th:text="${assignment.flightId}"></td>
        <td th:text="${assignment.staffId}"></td>
        <td>
            <a th:href="@{'/assignments/' + ${assignment.id} + '/details'}">Details</a> |
            <a th:href="@{'/assignments/' + ${assignment.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/assignments/' + ${assignment.id} + '/delete'}"
                  method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
