<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>New NoticeBoard</title></head>
<body>
<h2>New NoticeBoard</h2>
<form th:action="@{/noticeboards}" th:object="${board}" method="post">
    <label>ID: <input type="text" th:field="*{id}"/></label><br/>
    <label>Date (text): <input type="text" th:field="*{date}"/></label><br/>
    <button type="submit">Create</button>
</form>
</body>
</html>
