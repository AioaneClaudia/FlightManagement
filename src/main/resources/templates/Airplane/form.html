<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Airplane</title>
</head>
<body>
<h1>Add New Airplane</h1>

<form th:action="@{/airplanes}" th:object="${airplane}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br><br>

    <label>Number:</label>
    <input type="number" th:field="*{number}" required><br><br>

    <label>Model:</label>
    <input type="text" th:field="*{model}" required><br><br>

    <label>Capacity:</label>
    <input type="number" th:field="*{capacity}" required><br><br>

    <button type="submit">Add</button>
</form>

<a href="/airplanes">Back to list</a>

</body>
</html>
