<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Flight</title>
</head>
<body>
<h1>Add New Flight</h1>
<form th:action="@{/flights}" th:object="${flight}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br><br>
    <label>Origin:</label>
    <input type="text" th:field="*{origin}" required><br><br>
    <label>Destination:</label>
    <input type="text" th:field="*{destination}" required><br><br>
    <label>Price:</label>
    <input type="number" th:field="*{price}" required><br><br>
    <button type="submit">Add</button>
</form>
<a href="/flights">Back to list</a>
</body>
</html>
