<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Flight</title>
</head>
<body>
<h1>Add New Flight</h1>

<form th:action="@{/flights}" th:object="${flight}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br><br>

    <label>Notice Board ID:</label>
    <input type="text" th:field="*{noticeBoardId}" required><br><br>

    <label>Airplane ID:</label>
    <input type="text" th:field="*{airplaneId}" required><br><br>

    <label>Departure Time:</label>
    <input type="datetime-local" th:field="*{departureTime}" required><br><br>

    <label>Arrival Time:</label>
    <input type="datetime-local" th:field="*{arrivalTime}" required><br><br>

    <button type="submit">Add</button>
</form>

<a href="/flights">Back to list</a>

</body>
</html>
