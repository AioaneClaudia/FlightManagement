<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flights</title>
</head>
<body>
<h1>All Flights</h1>

<a href="/flights/new">Add New Flight</a>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Notice Board ID</th>
        <th>Airplane ID</th>
        <th>Tickets Count</th>
        <th>Assignments Count</th>
        <th>Departure Time</th>
        <th>Arrival Time</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="flight : ${flights}">
        <td th:text="${flight.id}">ID</td>
        <td th:text="${flight.name}">Name</td>
        <td th:text="${flight.noticeBoard.id}">Notice Board ID</td>
        <td th:text="${flight.airplaneId}">Airplane ID</td>
        <td th:text="${#lists.size(flight.tickets)}">Tickets Count</td>
        <td th:text="${#lists.size(flight.flightAssignments)}">Assignments Count</td>
        <td th:text="${flight.departureTime}">Departure Time</td>
        <td th:text="${flight.arrivalTime}">Arrival Time</td>
        <td>
            <a th:href="@{'/flights/' + ${flight.id}}">Details</a> |
            <a th:href="@{'/flights/' + ${flight.id} + '/edit'}">Edit</a>
            <form th:action="@{'/flights/' + ${flight.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(flights)}">
        <td colspan="9">No flights available.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
