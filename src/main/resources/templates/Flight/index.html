<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flights</title>
</head>
<body>
<h1>All Flights</h1>

<a href="/flights/new">Add New Flight</a>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Notice Board ID</th>
        <th>Airplane ID</th>
        <th>Departure Time</th>
        <th>Arrival Time</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="flight : ${flights}">
        <td th:text="${flight.id}">ID</td>
        <td th:text="${flight.name}">Name</td>
        <td th:text="${flight.noticeBoardId}">Notice Board ID</td>
        <td th:text="${flight.airplaneId}">Airplane ID</td>
        <td th:text="${flight.departureTime}">Departure</td>
        <td th:text="${flight.arrivalTime}">Arrival</td>
        <td>
            <form th:action="@{'/flights/' + ${flight.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
