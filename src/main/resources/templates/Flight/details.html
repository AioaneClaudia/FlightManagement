<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flight Details</title>
</head>
<body>

<h2>Flight Details</h2>

<p><strong>ID:</strong> <span th:text="${flight.id}"></span></p>
<p><strong>Name:</strong> <span th:text="${flight.name}"></span></p>

<p><strong>NoticeBoard:</strong>
    <span th:text="${flight.noticeBoard.id}"></span>
</p>

<p><strong>Airplane:</strong>
    <span th:text="${flight.airplane.id + ' (' + flight.airplane.model + ')'}"></span>
</p>

<p><strong>Departure:</strong> <span th:text="${flight.departureTime}"></span></p>
<p><strong>Arrival:</strong> <span th:text="${flight.arrivalTime}"></span></p>

<h3>Tickets</h3>
<ul>
    <li th:each="t : ${flight.tickets}" th:text="${t.id}"></li>
    <li th:if="${#lists.isEmpty(flight.tickets)}">No tickets.</li>
</ul>

<h3>Assignments</h3>
<ul>
    <li th:each="fa : ${flight.flightAssignments}" th:text="${fa.id}"></li>
    <li th:if="${#lists.isEmpty(flight.flightAssignments)}">No assignments.</li>
</ul>

<br/>
<a th:href="@{'/flights/' + ${flight.id} + '/edit'}">Edit</a> |
<a href="/flights">Back to list</a>

<form th:action="@{'/flights/' + ${flight.id} + '/delete'}" method="post" style="display:inline">
    <button type="submit">Delete</button>
</form>

</body>
</html>
