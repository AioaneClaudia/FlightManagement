<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passenger Form</title>
</head>
<body>

<h2 th:text="${passenger.id} != '' ? 'Edit Passenger' : 'New Passenger'"></h2>

<form th:action="@{${passenger.id} != '' ? '/passengers/' + ${passenger.id} : '/passengers'}"
      th:object="${passenger}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${passenger.id} != ''"/><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br><br>

    <label>Currency:</label>
    <input type="text" th:field="*{currency}" required/><br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required/><br><br>

    <label>Date Of Birth:</label>
    <input type="date" th:field="*{dateOfBirth}" required/><br><br>

    <button type="submit" th:text="${passenger.id} != '' ? 'Update' : 'Create'"></button>

</form>

<a href="/passengers">Back to list</a>

</body>
</html>
