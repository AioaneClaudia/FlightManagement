<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Passenger</title>
</head>
<body>
<h1>Add New Passenger</h1>
<form th:action="@{/passengers}" th:object="${passenger}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br><br>
    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br><br>
    <label>Currency:</label>
    <input type="text" th:field="*{currency}" required><br><br>
    <label>Email:</label>
    <input type="email" th:field="*{email}" required><br><br>
    <label>DateOfBirth:</label>
    <input type="date" th:field="*{dateOfBirth}" required><br><br>
    <button type="submit">Add</button>
</form>
<a href="/passengers">Back to list</a>
</body>
</html>
