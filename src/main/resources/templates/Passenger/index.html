<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passengers</title>
</head>
<body>
<h1>All Passengers</h1>
<a href="/passengers/new">Add New Passenger</a>
<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="passenger : ${passengers}">
        <td th:text="${passenger.id}">ID</td>
        <td th:text="${passenger.firstName}">First</td>
        <td th:text="${passenger.lastName}">Last</td>
        <td th:text="${passenger.email}">Email</td>
        <td>
            <form th:action="@{'/passengers/' + ${passenger.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
